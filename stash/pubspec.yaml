name: stash
description: "Your smart personal resource & reel organizer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.8.0
  file_picker: ^10.3.8
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  receive_sharing_intent: ^1.8.0
  share_plus: ^11.1.0
  url_launcher: ^6.3.0
  http: ^1.2.1
  html: ^0.15.4
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  permission_handler: ^11.3.1
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  local_auth: ^3.0.2
